        :root {

            --accent-red: #ef4444;
            --accent-yellow: #f59e0b;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .logo-area {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .logo-icon { font-size: 1.8rem; }
        .logo-text {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a78bfa, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .logo-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-left: 8px;
            border-left: 1px solid rgba(255,255,255,0.2);
            padding-left: 8px;
        }
        .app-nav { display: flex; gap: 15px; }
        .nav-item {
            color: var(--text-muted);
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s;
        }
        .nav-item:hover, .nav-item.active {
            color: var(--text-main);
            background: rgba(99, 102, 241, 0.15);
            box-shadow: inset 0 0 8px rgba(99, 102, 241, 0.2);
        }
        .warning-banner {
            background: rgba(245, 158, 11, 0.15);
            border: 1px solid var(--accent-yellow);
            color: #fbbf24;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 0.85rem;
            margin-bottom: 20px;
            display: none;
            text-align: center;
        }
        .layout-grid {
            display: grid;
            grid-template-columns: 280px 1fr 340px;
            gap: 20px;
        }
        .panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(8px);
        }
        .panel h2 {
            margin-top: 0;
            font-size: 1.1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 8px;
            color: var(--accent-indigo);
            font-weight: 700;
        }
        .summary-bar {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }
        .metric-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 12px 18px;
            text-align: center;
        }
        .metric-card label {
            font-size: 0.75rem;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .metric-card .val {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text-main);
            margin-top: 5px;
        }
        .network-container { position: relative; margin-bottom: 20px; }
        .network-svg {
            width: 100%;
            height: auto;
            background: rgba(13, 20, 35, 0.4);
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }
        .track-line { stroke-width: 3; fill: none; stroke-linecap: round; }
        .track-up { stroke: rgba(99, 102, 241, 0.4); }
        .track-down { stroke: rgba(99, 102, 241, 0.4); }
        .track-congested { stroke: var(--accent-yellow) !important; stroke-width: 5; }
        .track-blocked { stroke: var(--accent-red) !important; stroke-width: 5; }
        
        .station-bg {
            fill: #0d1423;
            stroke: rgba(99, 102, 241, 0.6);
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.3s;
        }
        .station-bg:hover { stroke: var(--accent-purple); fill: #162136; }
        .station-core { fill: var(--accent-green); cursor: pointer; }
        .station-congested .station-core { fill: var(--accent-yellow); }
        .station-full .station-core { fill: var(--accent-red); }
        
        .station-label { font-size: 11px; fill: var(--text-main); font-weight: bold; text-anchor: middle; }
        .station-sub { font-size: 8px; fill: var(--text-muted); text-anchor: middle; }
        
        .sig-light { fill: var(--accent-green); stroke: rgba(0,0,0,0.5); stroke-width: 1.2; cursor: pointer; }
        .sig-red { fill: var(--accent-red); }
        .sig-yellow { fill: var(--accent-yellow); }
        .sig-label { font-size: 8px; fill: var(--text-muted); font-weight: bold; }
        
        .train-bubble { fill: var(--bg-color); stroke: var(--accent-purple); stroke-width: 2; cursor: pointer; }
        .train-text { font-size: 9px; fill: var(--text-main); text-anchor: middle; cursor: pointer; }
        .selected-glow {
            fill: none;
            stroke: var(--accent-purple);
            stroke-width: 3;
            animation: pulse 1.5s infinite ease-in-out;
        }
        @keyframes pulse {
            0% { r: 12px; opacity: 0.6; }
            50% { r: 20px; opacity: 0.2; }
            100% { r: 12px; opacity: 0.6; }
        }
        .train-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            max-height: 480px;
            overflow-y: auto;
            padding-right: 5px;
        }
        .train-sidebar-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .train-sidebar-card:hover, .train-sidebar-card.selected {
            border-color: var(--accent-purple);
            background: rgba(139, 92, 246, 0.1);
        }
        .train-sidebar-card h3 {
            margin: 0 0 6px 0;
            font-size: 0.85rem;
            color: var(--text-main);
            display: flex;
            justify-content: space-between;
        }
        .train-sidebar-card p {
            margin: 3px 0;
            font-size: 0.75rem;
            color: var(--text-muted);
        }
        .delay-tag {

            color: var(--accent-red);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .delay-normal {
            background: rgba(16, 185, 129, 0.15);
            color: var(--accent-green);
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 600;
        }
        .pipeline-flow {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 15px;
        }
        .pipeline-step {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            padding: 8px 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.75rem;
            cursor: pointer;
            transition: all 0.3s;
        }
        .pipeline-step:hover, .pipeline-step.active {
            border-color: var(--accent-indigo);
            background: rgba(99, 102, 241, 0.1);
        }
        .step-name { font-weight: 600; }
        .step-status { font-style: italic; color: var(--text-muted); }
        .step-status.completed { color: var(--accent-green); font-weight: bold; }
        .bottom-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-top: 20px;
        }
        .solver-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.8rem;
            margin-top: 10px;
        }
        .solver-table th {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid var(--border-color);
            color: var(--accent-indigo);
        }
        .solver-table td {
            padding: 8px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .solver-table tr.highlight {
            background: rgba(99, 102, 241, 0.08);
            font-weight: bold;
        }
        .player-btn {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-indigo));

            padding: 8px 20px;
            border-radius: 6px;
            font-weight: 700;
            font-size: 0.85rem;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3);
            transition: all 0.3s;

        .player-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 6px 16px rgba(99, 102, 241, 0.4);
        }

            color: var(--text-main);

        .trace-node .val-sub {
            font-size: 0.7rem;
            color: var(--text-muted);

            background: rgba(255,255,255,0.05);
            height: 14px;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 4px;
        }
        .bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #6366f1, #a78bfa);
            border-radius: 4px;
        }
