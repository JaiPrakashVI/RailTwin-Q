<!DOCTYPE html>
<html lang="en">

<head>
    <style>
        :root {
            --sidebar-bg: #0b0f19;
            --main-bg: #f1f5f9;
            --card-bg: #ffffff;
            --border-color: #cbd5e1;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #64748b;
            --accent-blue: #2563eb;
            --accent-blue-light: #3b82f6;
            --accent-cyan: #0891b2;
            --accent-green: #10b981;
            --accent-yellow: #f59e0b;
            --accent-red: #ef4444;
            --accent-purple: #8b5cf6;
            --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.05), 0 1px 2px 0 rgba(0, 0, 0, 0.02);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.06), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--main-bg);
            color: var(--text-primary);
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        .sidebar {
            width: 240px;
            background: var(--sidebar-bg);
            border-right: 1px solid rgba(255, 255, 255, 0.06);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 14px;
            flex-shrink: 0;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 24px;
        }

        .brand-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }

        .brand-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: white;
            letter-spacing: -0.3px;
        }

        .brand-sub {
            font-size: 0.62rem;
            color: #38bdf8;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .nav-menu {
            display: flex;
            flex-direction: column;
            gap: 3px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 9px 12px;
            border-radius: 8px;
            color: #94a3b8;
            text-decoration: none;
            font-size: 0.83rem;
            font-weight: 500;
            transition: all 0.2s;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.04);
            color: white;
        }

        .nav-item.active {
            background: var(--accent-blue);
            color: white;
            font-weight: 600;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
        }

        .sidebar-bottom {
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 14px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .status-header {
            font-size: 0.68rem;
            font-weight: 700;
            color: #64748b;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .status-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
            font-size: 0.73rem;
            color: #94a3b8;
        }

        .status-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--accent-green);
            display: inline-block;
        }

        .sim-time-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 8px;
            padding: 9px 12px;
        }

        .sim-time-val {
            font-size: 1.05rem;
            font-weight: 700;
            color: white;
        }

        .badge-live {
            background: rgba(16, 185, 129, 0.2);
            color: var(--accent-green);
            font-size: 0.62rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 4px;
            float: right;
        }

        .main-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .topbar {
            height: 58px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 22px;
            background: #ffffff;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
        }

        .topbar-title {
            font-size: 1.05rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .weather-badge {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.73rem;
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-secondary);
        }

        .mode-badge {
            background: linear-gradient(135deg, rgba(139, 92, 246, .12), rgba(99, 102, 241, .12));
            border: 1px solid rgba(139, 92, 246, .3);
            color: var(--accent-purple);
            padding: 5px 14px;
            border-radius: 20px;
            font-size: 0.73rem;
            font-weight: 700;
        }

        .dashboard-content {
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 13px;
        }

        .kpi-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 11px;
            padding: 14px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.2s;
            box-shadow: var(--shadow-sm);
        }

        .kpi-card:hover {
            border-color: #94a3b8;
            transform: translateY(-1px);
            box-shadow: var(--shadow-md);
        }

        .kpi-label {
            font-size: 0.7rem;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .kpi-val {
            font-size: 1.38rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-top: 3px;
            letter-spacing: -0.5px;
        }

        .kpi-sub {
            font-size: 0.67rem;
            margin-top: 3px;
            font-weight: 600;
        }

        .trend-up {
            color: var(--accent-red);
        }

        .trend-down {
            color: var(--accent-green);
        }

        .trend-neutral {
            color: var(--text-muted);
        }

        .kpi-icon-wrap {
            width: 40px;
            height: 40px;
            border-radius: 9px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            background: #f8fafc;
            border: 1px solid var(--border-color);
            flex-shrink: 0;
        }

        .middle-grid {
            display: grid;
            grid-template-columns: 1fr 320px;
            gap: 16px;
        }

        .map-card {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            position: relative;
            box-shadow: var(--shadow-md);
            flex: 1;
            /* Fills remaining vertical space */
            width: 100%;
        }

        .card-header-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 11px;
        }

        .card-header-bar h3 {
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .map-legend {
            display: flex;
            align-items: center;
            gap: 14px;
            font-size: 0.7rem;
            color: var(--text-secondary);
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 4px;
        }

        .network-svg {
            width: 100%;
            height: 100%;
            flex: 1;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid var(--border-color);
        }

        .track-line {
            stroke-width: 3.5;
            fill: none;
            stroke-linecap: round;
            transition: all 0.3s;
        }

        .track-normal {
            stroke: #cbd5e1;
        }

        .track-congested {
            stroke: var(--accent-yellow) !important;
            stroke-width: 5;
        }

        .track-blocked {
            stroke: var(--accent-red) !important;
            stroke-width: 5;
        }

        .station-bg {
            fill: #ffffff;
            stroke: #94a3b8;
            stroke-width: 2;
            cursor: pointer;
            transition: all 0.2s;
        }

        .station-bg:hover {
            stroke: var(--accent-blue-light);
            fill: #f1f5f9;
        }

        .station-core {
            fill: var(--accent-green);
            cursor: pointer;
        }

        .station-label {
            font-size: 10px;
            fill: var(--text-primary);
            font-weight: 600;
            text-anchor: middle;
            pointer-events: none;
        }

        .incident-badge {
            position: absolute;
            bottom: 26px;
            left: 26px;
            background: rgba(239, 68, 68, 0.08);
            border: 1px solid var(--accent-red);
            padding: 7px 13px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.76rem;
            color: var(--accent-red);
        }
    </style>
</head>

<body>
    <div class="map-card">
        <div class="card-header-bar">
            <h3>🗺️ Live Digital Twin — Railway Network Topology</h3>
            <div class="map-legend"><span><span class="legend-dot"
                        style="background:#cbd5e1;"></span>Normal</span><span><span class="legend-dot"
                        style="background:var(--accent-yellow);"></span>Congested</span><span><span class="legend-dot"
                        style="background:var(--accent-red);"></span>Blocked</span></div>
        </div>
        <svg viewBox="0 0 1000 460" class="network-svg" id="topology-svg">
            <line id="map-track-1" x1="220" y1="220" x2="450" y2="220" class="track-line track-normal" />
            <line id="map-track-3" x1="450" y1="220" x2="680" y2="220" class="track-line track-normal" />
            <line id="map-track-5" x1="680" y1="220" x2="900" y2="220" class="track-line track-normal" />
            <line id="map-track-6" x1="450" y1="220" x2="450" y2="130" class="track-line track-normal" />
            <line id="map-track-7" x1="450" y1="130" x2="450" y2="50" class="track-line track-normal" />
            <line id="map-track-2" x1="220" y1="220" x2="220" y2="340" class="track-line track-normal" />
            <line id="map-track-10" x1="220" y1="340" x2="450" y2="340" class="track-line track-normal" />
            <line id="map-track-4" x1="220" y1="340" x2="220" y2="420" class="track-line track-normal" />
            <line id="map-track-8" x1="220" y1="420" x2="450" y2="220" class="track-line track-normal" />
            <line id="map-track-9" x1="680" y1="220" x2="680" y2="340" class="track-line track-normal" />
            <g transform="translate(220,220)">
                <circle r="14" class="station-bg" />
                <circle r="7" class="station-core" /><text y="-20" class="station-label">MAS</text>
            </g>
            <g transform="translate(220,340)">
                <circle r="14" class="station-bg" />
                <circle r="7" class="station-core" /><text y="25" class="station-label">TBM</text>
            </g>
            <g transform="translate(450,340)">
                <circle r="14" class="station-bg" />
                <circle r="7" class="station-core" /><text y="25" class="station-label">CGL</text>
            </g>
            <g transform="translate(220,420)">
                <circle r="14" class="station-bg" />
                <circle r="7" class="station-core" /><text y="25" class="station-label">CJ</text>
            </g>
            <g transform="translate(450,220)">
                <circle r="16" class="station-bg" style="stroke:#6366f1;stroke-width:2.5;" />
                <circle r="8" class="station-core" style="fill:#6366f1;" /><text y="-23" class="station-label"
                    style="fill:#6366f1;">AJJ</text>
            </g>
            <g transform="translate(450,130)">
                <circle r="14" class="station-bg" />
                <circle r="7" class="station-core" /><text y="-20" class="station-label">TRT</text>
            </g>
            <g transform="translate(450,50)">
                <circle r="14" class="station-bg" />
                <circle r="7" class="station-core" /><text y="-18" class="station-label">TPTY</text>
            </g>
            <g transform="translate(680,220)">
                <circle r="16" class="station-bg" style="stroke:#6366f1;stroke-width:2.5;" />
                <circle r="8" class="station-core" style="fill:#6366f1;" /><text y="-23" class="station-label"
                    style="fill:#6366f1;">KPD</text>
            </g>
            <g transform="translate(680,340)">
                <circle r="14" class="station-bg" />
                <circle r="7" class="station-core" /><text y="25" class="station-label">VLR</text>
            </g>
            <g transform="translate(900,220)">
                <circle r="16" class="station-bg" style="stroke:#6366f1;stroke-width:2.5;" />
                <circle r="8" class="station-core" style="fill:#6366f1;" /><text y="-23" class="station-label"
                    style="fill:#6366f1;">JTJ</text>
            </g>
            <circle id="map-incident-pulse" cx="450" cy="220" r="22" fill="none" stroke="var(--accent-red)"
                stroke-width="2" visibility="hidden">
                <animate attributeName="r" values="16;34;16" dur="2s" repeatCount="indefinite" />
                <animate attributeName="stroke-opacity" values="1;0;1" dur="2s" repeatCount="indefinite" />
            </circle>
        </svg>
        <div class="incident-badge" id="map-incident-badge" style="display:none;"><span>🚨</span><strong>Active
                Incident:</strong>&nbsp;<span id="incident-text">Disruption</span></div>
    </div>
</body>
